[project]
name = "code-graph-bench"
version = "0.1.0"
description = "Independent, apples-to-apples benchmark for code-intelligence tools for AI agents (semble, code-review-graph, codegraph)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Minsu Lee" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
]

# Tools under test. Kept as optional extras so the harness installs/imports
# them only when an arm that needs them runs. codegraph (TypeScript) is invoked
# as the `codegraph` npm CLI and is NOT a Python dependency.
[project.optional-dependencies]
semble = ["semble[mcp]>=0.1"]
crg = ["code-review-graph>=2.3"]
tools = ["semble[mcp]>=0.1", "code-review-graph>=2.3"]
dev = ["pytest>=8.0"]

[project.scripts]
cgbench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
